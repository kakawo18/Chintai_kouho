name = "chintai-kouho-extract"
main = "worker.js"
compatibility_date = "2026-01-01"

# 同じ相手（IP）からのリクエスト回数の上限。合言葉の総当たりを止めるために要ります。
# 自動入力は1件登録するごとに1回なので、1分15回で普通の使い方には当たりません。
# namespace_id はこの Worker の中で通し番号を振るだけの値で、どこかに登録する必要はありません。
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 15, period = 60 }

# 許可するアプリの配信元。GitHub Pages の URL に合わせて書き換えてください。
# 手元で試すときは http://localhost:8000 を一時的に指定します。
[vars]
ALLOWED_ORIGIN = "https://kakawo18.github.io"

# ベースURLは契約したプラットフォームに合わせてください。
# platform.moonshot.ai なら https://api.moonshot.ai/v1
# platform.kimi.ai    なら https://api.kimi.ai/v1
KIMI_BASE_URL = "https://api.moonshot.ai/v1"

# 使うモデル。決まった項目を抜き出すだけなので最上位のモデルは要りません。
#   kimi-k2.6 … 既定。汎用。入力 $0.95 / 出力 $4（100万トークンあたり）
#   kimi-k3   … 最上位。入力 $3 / 出力 $15。読み取りの精度が足りないときだけ
# ここを書き換えて npx wrangler deploy し直すか、Cloudflare の画面で変えられます。
KIMI_MODEL = "kimi-k2.6"

# 考えてから答えるモデルでは、考える過程のトークンも下の上限に含まれ、
# そのぶん出力として課金されます。決まった項目を抜き出すだけなので思考は切ります。
# 切らないと、考えている途中で打ち切られて答えが途中で切れます。
# このモデルは思考が要る、と分かったときは disabled 以外を入れてください。
KIMI_THINKING = "disabled"
KIMI_MAX_TOKENS = "16000"

# KIMI_API_KEY と APP_PASSPHRASE はここに書かないこと。
# 必ず Secret として登録します:
#   npx wrangler secret put KIMI_API_KEY
#   npx wrangler secret put APP_PASSPHRASE
